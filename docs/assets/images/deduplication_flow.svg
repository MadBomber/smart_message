<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="dd-title dd-desc">
  <title id="dd-title">Deduplication: reserve before the handler, release on failure</title>
  <desc id="dd-desc">The dispatcher reserves the message UUID in the handler's deduplication queue before the handler runs. A second delivery of the same UUID is skipped. If the handler fails, the reservation is released and the message goes to the dead letter queue.</desc>
  <defs>
    <style>
      .box  { stroke-width: 2; }
      .disp { fill: #33230c; stroke: #d29922; }
      .ddq  { fill: #251a3d; stroke: #bc8cff; }
      .hand { fill: #0c2f33; stroke: #39c5cf; }
      .ok   { fill: #0f2d1c; stroke: #3fb950; }
      .dlq  { fill: #3a1418; stroke: #f85149; }
      .skip { fill: #21262d; stroke: #8b949e; }
      .head { font: bold 14px sans-serif; fill: #e6edf3; text-anchor: middle; }
      .body { font: 12px sans-serif; fill: #c9d1d9; text-anchor: middle; }
      .note { font: 11px sans-serif; fill: #8b949e; text-anchor: middle; }
      .flow { stroke: #8b949e; stroke-width: 2; fill: none; marker-end: url(#dd-arrow); }
      .fail { stroke: #f85149; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#dd-arrow-fail); }
    </style>
    <marker id="dd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="dd-arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect rx="8" class="box disp" x="20" y="120" width="180" height="80"/>
  <text class="head" x="110" y="150">Dispatcher</text>
  <text class="body" x="110" y="172">message for one handler</text>

  <rect rx="8" class="box ddq" x="260" y="120" width="200" height="80"/>
  <text class="head" x="360" y="146">reserve(uuid)</text>
  <text class="body" x="360" y="166">queue for this handler</text>
  <text class="body" x="360" y="182">of this message class</text>
  <path class="flow" d="M200,160 L258,160"/>

  <rect rx="8" class="box skip" x="260" y="250" width="200" height="60"/>
  <text class="head" x="360" y="276">Skipped</text>
  <text class="body" x="360" y="296">counted as 'duplicate'</text>
  <path class="flow" d="M360,200 L360,248"/>
  <text class="note" x="416" y="228">already reserved</text>

  <rect rx="8" class="box hand" x="520" y="120" width="160" height="80"/>
  <text class="head" x="600" y="150">Handler runs</text>
  <text class="body" x="600" y="172">on a pool thread</text>
  <path class="flow" d="M460,160 L518,160"/>
  <text class="note" x="489" y="150">new</text>

  <rect rx="8" class="box ok" x="720" y="30" width="120" height="70"/>
  <text class="head" x="780" y="58">Returned</text>
  <text class="body" x="780" y="80">UUID stays</text>
  <path class="flow" d="M680,140 L728,102"/>

  <rect rx="8" class="box dlq" x="700" y="220" width="150" height="90"/>
  <text class="head" x="775" y="246">Raised</text>
  <text class="body" x="775" y="266">release(uuid)</text>
  <text class="body" x="775" y="282">then dead letter</text>
  <text class="body" x="775" y="298">queue</text>
  <path class="fail" d="M680,180 L722,218"/>
</svg>
